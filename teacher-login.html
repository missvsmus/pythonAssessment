<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login | Quiz Environment</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <style>
    :root { --ink:#172b4d; --muted:#667085; --line:#e3e8ef; --blue:#3157c8; --bg:#f4f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .panel { width:min(100%,430px); background:#fff; border:1px solid var(--line); border-radius:18px; padding:34px; box-shadow:0 12px 34px rgba(23,43,77,.08); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#172b4d; color:#fff; font-size:22px; }
    .brand strong { display:block; font-size:1rem; }
    .brand span { color:var(--muted); font-size:.82rem; }
    h1 { margin:0 0 6px; font-size:1.65rem; }
    p { margin:0 0 22px; color:var(--muted); }
    label { display:block; margin-bottom:7px; font-weight:650; }
    input { width:100%; border:1px solid #c8d0dc; border-radius:9px; padding:13px 14px; font:inherit; }
    input:focus { outline:3px solid rgba(49,87,200,.15); border-color:var(--blue); }
    button { width:100%; margin-top:16px; border:0; border-radius:9px; padding:13px 16px; background:var(--blue); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { min-height:24px; margin-top:14px; color:#b42318; }
    .back { display:block; margin-top:18px; text-align:center; color:var(--muted); text-decoration:none; font-size:.9rem; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="mark" aria-hidden="true">⑂</div>
      <div><strong>Quiz Environment</strong><span>Teacher workspace</span></div>
    </div>
    <h1>Teacher sign in</h1>
    <p>Enter your teacher access code to manage quizzes and review student work.</p>
    <form id="login-form">
      <label for="teacher-code">Teacher access code</label>
      <input id="teacher-code" type="password" autocomplete="current-password" required autofocus>
      <button id="login-btn" type="submit">Sign in</button>
    </form>
    <div id="login-message" class="message" role="alert" aria-live="polite"></div>
    <a class="back" href="index.html">← Back to student quiz login</a>
  </main>
  <script src="config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const form = $("login-form");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = $("login-btn");
      const message = $("login-message");
      button.disabled = true;
      button.textContent = "Signing in…";
      message.textContent = "";
      try {
        if (typeof API_URL === "undefined" || !API_URL) throw new Error("The Apps Script API URL is not configured in config.js.");
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action:"login", code:$("teacher-code").value.trim() })
        });
        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "Sign-in failed.");
        if (result.role !== "teacher" || !result.teacherToken) throw new Error("That access code does not have teacher permissions.");
        localStorage.setItem("assessmentTeacherToken", result.teacherToken);
        window.location.replace("teacher-dashboard.html");
      } catch (error) {
        message.textContent = error.message || "Unable to sign in. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
